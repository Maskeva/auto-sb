<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sing-box 配置生成器</title>
    <style>
        :root {
            --primary-color: #4a6ee0;
            --secondary-color: #6c757d;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --light-bg: #f8f9fa;
            --dark-bg: #343a40;
            --border-color: #dee2e6;
            --card-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f5f7fa;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }
        
        .description {
            color: var(--secondary-color);
            margin-bottom: 20px;
        }
        
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: var(--card-shadow);
            padding: 25px;
            margin-bottom: 20px;
        }
        
        .card-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--primary-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
            min-height: 120px;
            resize: vertical;
            font-family: monospace;
        }
        
        .btn {
            display: inline-block;
            padding: 10px 15px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s;
        }
        
        .btn:hover {
            background-color: #3a5bd0;
        }
        
        .btn-success {
            background-color: var(--success-color);
        }
        
        .btn-success:hover {
            background-color: #218838;
        }
        
        .btn-danger {
            background-color: var(--danger-color);
        }
        
        .btn-danger:hover {
            background-color: #c82333;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .protocol-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-right: 5px;
            margin-bottom: 5px;
            color: white;
        }
        
        .vmess-badge {
            background-color: #007bff;
        }
        
        .vless-badge {
            background-color: #28a745;
        }
        
        .trojan-badge {
            background-color: #dc3545;
        }
        
        .ss-badge {
            background-color: #6f42c1;
        }
        
        .hysteria-badge {
            background-color: #fd7e14;
        }
        
        .alert {
            padding: 10px 15px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        
        .alert-info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .config-preview {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            margin-top: 15px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        pre {
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.9rem;
        }
        
        .hidden {
            display: none;
        }
        
        footer {
            text-align: center;
            margin-top: 30px;
            color: var(--secondary-color);
            font-size: 0.9rem;
        }
        
        .stats {
            margin-top: 10px;
            font-size: 0.9rem;
            color: var(--secondary-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Sing-box 配置生成器</h1>
            <p class="description">从Base64订阅链接或协议链接生成sing-box配置文件</p>
        </header>
        
        <div class="card">
            <div class="card-title">输入配置信息</div>
            
            <div class="alert alert-info">
                支持以下格式：
                <ul style="margin-top: 5px; margin-left: 20px;">
                    <li>Base64编码的订阅链接</li>
                    <li>单行或多行协议链接 (vmess://, vless://, trojan://, ss://)</li>
                </ul>
            </div>
            
            <div class="form-group">
                <label for="import-text">输入Base64订阅或协议链接</label>
                <textarea id="import-text" placeholder="请输入Base64编码的订阅内容，或协议链接（每行一个）"></textarea>
            </div>
            
            <div class="btn-group">
                <button class="btn" id="generate-btn">生成配置</button>
                <button class="btn btn-danger" id="clear-btn">清空</button>
            </div>
        </div>
        
        <div class="card">
            <div class="card-title">生成的配置</div>
            
            <div id="protocol-badges"></div>
            <div class="stats" id="stats-info"></div>
            
            <div class="alert alert-success hidden" id="success-alert">
                配置生成成功！
            </div>
            
            <div class="alert alert-danger hidden" id="error-alert">
                配置生成失败，请检查输入信息。
            </div>
            
            <div class="config-preview">
                <pre id="config-output">生成的配置将显示在这里</pre>
            </div>
            
            <div class="btn-group">
                <button class="btn btn-success" id="copy-btn">复制配置</button>
                <button class="btn" id="download-btn">下载配置</button>
            </div>
        </div>
        
        <footer>
            <p>Sing-box 配置生成器 &copy; 2023</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 生成配置按钮
            document.getElementById('generate-btn').addEventListener('click', generateConfig);
            
            // 清空按钮
            document.getElementById('clear-btn').addEventListener('click', function() {
                document.getElementById('import-text').value = '';
                document.getElementById('config-output').textContent = '生成的配置将显示在这里';
                document.getElementById('protocol-badges').innerHTML = '';
                document.getElementById('stats-info').textContent = '';
                hideAlerts();
            });
            
            // 复制配置按钮
            document.getElementById('copy-btn').addEventListener('click', function() {
                const configOutput = document.getElementById('config-output');
                if (configOutput.textContent === '生成的配置将显示在这里') {
                    showError('请先生成配置');
                    return;
                }
                
                navigator.clipboard.writeText(configOutput.textContent)
                    .then(() => {
                        alert('配置已复制到剪贴板！');
                    })
                    .catch(err => {
                        console.error('复制失败: ', err);
                        alert('复制失败，请手动复制配置内容。');
                    });
            });
            
            // 下载配置按钮
            document.getElementById('download-btn').addEventListener('click', function() {
                const configOutput = document.getElementById('config-output');
                if (configOutput.textContent === '生成的配置将显示在这里') {
                    showError('请先生成配置');
                    return;
                }
                
                const blob = new Blob([configOutput.textContent], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'sing-box-config.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });
            
            // 生成配置函数
            function generateConfig() {
                const importText = document.getElementById('import-text').value.trim();
                if (!importText) {
                    showError('请输入订阅内容或协议链接');
                    return;
                }
                
                try {
                    let configs = [];
                    
                    // 判断输入类型
                    if (isBase64(importText)) {
                        // Base64订阅内容
                        configs = parseBase64Subscription(importText);
                    } else {
                        // 协议链接（单行或多行）
                        const lines = importText.split('\n').filter(line => line.trim());
                        configs = parseProtocolLinks(lines);
                    }
                    
                    if (configs.length === 0) {
                        showError('未找到有效的配置信息');
                        return;
                    }
                    
                    // 生成完整的sing-box配置
                    const fullConfig = {
                        "log": {
                            "level": "info",
                            "timestamp": true
                        },
                        "dns": {
                            "servers": [
                                {
                                    "tag": "google",
                                    "address": "tls://8.8.8.8",
                                    "detour": "direct"
                                },
                                {
                                    "tag": "local",
                                    "address": "223.5.5.5",
                                    "detour": "direct"
                                }
                            ],
                            "rules": [
                                {
                                    "outbound": "any",
                                    "server": "local"
                                }
                            ],
                            "final": "google"
                        },
                        "inbounds": [
                            {
                                "type": "tun",
                                "interface_name": "tun0",
                                "mtu": 9000,
                                "stack": "mixed",
                                "endpoint_independent_nat": true,
                                "sniff": true
                            }
                        ],
                        "outbounds": [
                            {
                                "type": "direct",
                                "tag": "direct"
                            },
                            {
                                "type": "block",
                                "tag": "block"
                            },
                            {
                                "type": "dns",
                                "tag": "dns-out"
                            }
                        ],
                        "route": {
                            "rules": [
                                {
                                    "protocol": "dns",
                                    "outbound": "dns-out"
                                },
                                {
                                    "clash_mode": "direct",
                                    "outbound": "direct"
                                },
                                {
                                    "clash_mode": "global",
                                    "outbound": "proxy"
                                },
                                {
                                    "geoip": [
                                        "cn",
                                        "private"
                                    ],
                                    "outbound": "direct"
                                }
                            ],
                            "auto_detect_interface": true
                        }
                    };
                    
                    // 添加解析出的配置
                    configs.forEach((config, index) => {
                        config.tag = config.tag || `proxy-${index + 1}`;
                        fullConfig.outbounds.push(config);
                    });
                    
                    // 设置默认代理出口
                    if (configs.length > 0) {
                        fullConfig.outbounds.push({
                            "type": "selector",
                            "tag": "proxy",
                            "outbounds": configs.map((_, index) => `proxy-${index + 1}`)
                        });
                    }
                    
                    // 显示配置
                    document.getElementById('config-output').textContent = JSON.stringify(fullConfig, null, 2);
                    updateProtocolBadges(configs);
                    updateStats(configs.length);
                    showSuccess();
                } catch (error) {
                    console.error('生成配置时出错:', error);
                    showError('生成配置失败，请检查输入格式是否正确');
                }
            }
            
            // 解析Base64订阅
            function parseBase64Subscription(base64Str) {
                try {
                    const decoded = atob(base64Str);
                    const lines = decoded.split('\n').filter(line => line.trim());
                    return parseProtocolLinks(lines);
                } catch (error) {
                    throw new Error('Base64解码失败');
                }
            }
            
            // 解析协议链接
            function parseProtocolLinks(links) {
                const configs = [];
                
                links.forEach(link => {
                    try {
                        if (link.startsWith('vmess://')) {
                            configs.push(parseVmessLink(link));
                        } else if (link.startsWith('vless://')) {
                            configs.push(parseVlessLink(link));
                        } else if (link.startsWith('trojan://')) {
                            configs.push(parseTrojanLink(link));
                        } else if (link.startsWith('ss://')) {
                            configs.push(parseShadowsocksLink(link));
                        }
                    } catch (error) {
                        console.warn('解析链接失败:', link, error);
                    }
                });
                
                return configs;
            }
            
            // 解析VMess链接
            function parseVmessLink(link) {
                const base64Str = link.substring(8);
                const decoded = atob(base64Str);
                const vmessConfig = JSON.parse(decoded);
                
                const config = {
                    "type": "vmess",
                    "tag": vmessConfig.ps || "vmess-outbound",
                    "server": vmessConfig.add,
                    "server_port": parseInt(vmessConfig.port),
                    "uuid": vmessConfig.id,
                    "security": vmessConfig.scy || "auto",
                    "alter_id": parseInt(vmessConfig.aid) || 0
                };
                
                // 传输设置
                if (vmessConfig.net) {
                    config.transport = {
                        "type": vmessConfig.net
                    };
                    
                    if (vmessConfig.net === 'ws') {
                        config.transport.path = vmessConfig.path || "/";
                        config.transport.headers = {
                            "Host": vmessConfig.host || vmessConfig.add
                        };
                    }
                }
                
                // TLS设置
                if (vmessConfig.tls === 'tls') {
                    config.tls = {
                        "enabled": true,
                        "server_name": vmessConfig.sni || vmessConfig.host || vmessConfig.add
                    };
                }
                
                return config;
            }
            
            // 解析VLESS链接
            function parseVlessLink(link) {
                const url = new URL(link);
                const config = {
                    "type": "vless",
                    "tag": url.hash ? decodeURIComponent(url.hash.substring(1)) : "vless-outbound",
                    "server": url.hostname,
                    "server_port": parseInt(url.port),
                    "uuid": url.username
                };
                
                // 查询参数
                const params = new URLSearchParams(url.search);
                
                if (params.get('type')) {
                    config.transport = {
                        "type": params.get('type')
                    };
                    
                    if (params.get('type') === 'ws') {
                        config.transport.path = params.get('path') || "/";
                        if (params.get('host')) {
                            config.transport.headers = {
                                "Host": params.get('host')
                            };
                        }
                    }
                }
                
                if (params.get('security') === 'tls') {
                    config.tls = {
                        "enabled": true,
                        "server_name": params.get('sni') || url.hostname
                    };
                }
                
                if (params.get('flow')) {
                    config.flow = params.get('flow');
                }
                
                return config;
            }
            
            // 解析Trojan链接
            function parseTrojanLink(link) {
                const url = new URL(link);
                const config = {
                    "type": "trojan",
                    "tag": url.hash ? decodeURIComponent(url.hash.substring(1)) : "trojan-outbound",
                    "server": url.hostname,
                    "server_port": parseInt(url.port),
                    "password": url.username
                };
                
                // 查询参数
                const params = new URLSearchParams(url.search);
                
                if (params.get('type')) {
                    config.transport = {
                        "type": params.get('type')
                    };
                    
                    if (params.get('type') === 'ws') {
                        config.transport.path = params.get('path') || "/";
                        if (params.get('host')) {
                            config.transport.headers = {
                                "Host": params.get('host')
                            };
                        }
                    }
                }
                
                config.tls = {
                    "enabled": true,
                    "server_name": params.get('sni') || url.hostname
                };
                
                return config;
            }
            
            // 解析Shadowsocks链接
            function parseShadowsocksLink(link) {
                // 处理ss://base64#remark格式
                if (link.includes('@')) {
                    // ss://method:password@server:port#remark
                    const match = link.match(/ss:\/\/([^:]+):([^@]+)@([^:]+):(\d+)(?:#(.+))?/);
                    if (match) {
                        return {
                            "type": "shadowsocks",
                            "tag": match[5] || "ss-outbound",
                            "server": match[3],
                            "server_port": parseInt(match[4]),
                            "method": match[1],
                            "password": match[2]
                        };
                    }
                } else {
                    // ss://base64#remark格式
                    const base64Str = link.substring(5).split('#')[0];
                    const decoded = atob(base64Str);
                    const parts = decoded.split('@');
                    const methodPassword = parts[0].split(':');
                    const serverPort = parts[1].split(':');
                    
                    return {
                        "type": "shadowsocks",
                        "tag": link.split('#')[1] || "ss-outbound",
                        "server": serverPort[0],
                        "server_port": parseInt(serverPort[1]),
                        "method": methodPassword[0],
                        "password": methodPassword[1]
                    };
                }
                
                throw new Error('无法解析Shadowsocks链接');
            }
            
            // 检查字符串是否为Base64
            function isBase64(str) {
                try {
                    return btoa(atob(str)) === str;
                } catch (err) {
                    return false;
                }
            }
            
            // 更新协议徽章
            function updateProtocolBadges(configs) {
                const badgesContainer = document.getElementById('protocol-badges');
                const protocolCount = {};
                
                configs.forEach(config => {
                    const protocol = config.type;
                    protocolCount[protocol] = (protocolCount[protocol] || 0) + 1;
                });
                
                let badgesHTML = '';
                for (const [protocol, count] of Object.entries(protocolCount)) {
                    let badgeClass = '';
                    let badgeText = '';
                    
                    switch(protocol) {
                        case 'vmess':
                            badgeClass = 'vmess-badge';
                            badgeText = 'VMess';
                            break;
                        case 'vless':
                            badgeClass = 'vless-badge';
                            badgeText = 'VLESS';
                            break;
                        case 'trojan':
                            badgeClass = 'trojan-badge';
                            badgeText = 'Trojan';
                            break;
                        case 'shadowsocks':
                            badgeClass = 'ss-badge';
                            badgeText = 'Shadowsocks';
                            break;
                    }
                    
                    if (badgeClass) {
                        badgesHTML += `<span class="protocol-badge ${badgeClass}">${badgeText} × ${count}</span>`;
                    }
                }
                
                badgesContainer.innerHTML = badgesHTML;
            }
            
            // 更新统计信息
            function updateStats(count) {
                document.getElementById('stats-info').textContent = `共解析出 ${count} 个节点配置`;
            }
            
            // 显示成功消息
            function showSuccess() {
                document.getElementById('success-alert').classList.remove('hidden');
                document.getElementById('error-alert').classList.add('hidden');
            }
            
            // 显示错误消息
            function showError(message) {
                document.getElementById('error-alert').classList.remove('hidden');
                document.getElementById('error-alert').textContent = message;
                document.getElementById('success-alert').classList.add('hidden');
            }
            
            // 隐藏所有提示
            function hideAlerts() {
                document.getElementById('success-alert').classList.add('hidden');
                document.getElementById('error-alert').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
